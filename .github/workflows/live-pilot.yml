# Manual live pilot. Triggered only by workflow_dispatch.
# Do not add a pull_request or push trigger: this job can call a model.

name: Live pilot

"on":
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment manifest inside this repository
        required: true
        default: experiments/live-pilot-smoke.yaml
        type: string

permissions:
  contents: read

jobs:
  live:
    name: live pilot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install this repository and the inspect extra
        run: python -m pip install -e ".[dev,inspect]"

      - name: Fail closed when live secrets are missing
        shell: bash
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          OPENBOT_COMMIT: ${{ secrets.OPENBOT_COMMIT }}
          OPENBOT_BIN: ${{ secrets.OPENBOT_BIN }}
        run: |
          set -euo pipefail
          missing=0
          for name in LITELLM_API_KEY LITELLM_BASE_URL OPENBOT_COMMIT OPENBOT_BIN; do
            if [ -z "${!name}" ]; then
              echo "missing secret: ${name}" >&2
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "live pilot refuses to run without secrets" >&2
            exit 1
          fi
          case "${LITELLM_BASE_URL}" in
            *api.openai.com*|*api.anthropic.com*|*huggingface.co*)
              echo "LITELLM_BASE_URL must be the GPU farm LiteLLM host" >&2
              exit 1
              ;;
          esac

      - name: Run the live pilot
        env:
          EXPERIMENT: ${{ inputs.experiment }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          OPENBOT_COMMIT: ${{ secrets.OPENBOT_COMMIT }}
          OPENBOT_BIN: ${{ secrets.OPENBOT_BIN }}
          OPENBOT_IMAGE: ${{ secrets.OPENBOT_IMAGE }}
          LITELLM_IMAGE_DIGEST: ${{ secrets.LITELLM_IMAGE_DIGEST }}
        run: benchmark run --experiment "${EXPERIMENT}" --out results/live
