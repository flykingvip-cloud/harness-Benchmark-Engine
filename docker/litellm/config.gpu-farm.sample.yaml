# Sample LiteLLM config for the rented GPU server.
# model_name values match models/pools/pool-gpu-farm.example.yaml.
# Upstream targets are local vLLM and Ollama processes on that machine.
# This file has no cloud provider API key.
# Image: ghcr.io/berriai/litellm:v1.104.2

model_list:
  - model_name: vllm/REPLACE_ME-instruct
    litellm_params:
      model: hosted_vllm/REPLACE_ME-instruct
      api_base: http://127.0.0.1:8000/v1
  - model_name: ollama/REPLACE_ME
    litellm_params:
      model: ollama/REPLACE_ME
      api_base: http://127.0.0.1:11434
litellm_settings:
  drop_params: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
