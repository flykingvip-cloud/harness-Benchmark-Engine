[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openbot-harness-benchmark-engine"
dynamic = ["version"]
description = "OHBE: OpenBot Harness Benchmark Engine schemas, traces, gateway, and harness adapters"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "upbeyond" }]
keywords = ["ohbe", "benchmark", "agents", "harness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]
api = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.32,<1",
]
gateway = [
  "litellm==1.104.2",
]
inspect = [
  "inspect-ai==0.3.277",
]

[project.scripts]
benchmark = "ohbe.cli:cli"

[project.urls]
Homepage = "https://github.com/flykingvip-cloud/harness-Benchmark-Engine"
Repository = "https://github.com/flykingvip-cloud/harness-Benchmark-Engine"

[tool.hatch.version]
path = "src/ohbe/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ohbe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
